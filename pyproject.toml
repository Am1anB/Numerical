[project]
name = "numerical-methods-web"
version = "0.2.0"
description = "A simple numerical methods calculator website"
requires-python = ">=3.12"
dependencies = ["flask>=3.1"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
